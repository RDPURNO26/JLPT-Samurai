<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>JLPT Samurai — Kanji</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚔️</text></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="page-loader"><div class="logo">⚔️ JLPT SAMURAI</div><div class="bar"><div class="bar-fill"></div></div></div>
<canvas id="sakura-canvas"></canvas>
<nav class="samurai-nav"></nav>

<div class="page-wrap" id="app">
  <div class="page-title">漢字 KANJI DOJO</div>
  <div class="page-sub" id="kanji-sub">Loading kanji...</div>
  <div class="ink-divider"></div>

  <div class="tab-row">
    <button class="tab-btn active" onclick="showTab('list')">📋 Kanji List</button>
    <button class="tab-btn" onclick="showTab('flash')">🃏 Flashcards</button>
    <button class="tab-btn" onclick="showTab('quiz')">⚡ Quiz</button>
  </div>

  <!-- KANJI LIST -->
  <div class="tab-panel active" id="tab-list">
    <input type="text" class="search-bar" id="search" placeholder="🔍 Search kanji, reading, or meaning...">
    <div id="kanji-list"></div>
  </div>

  <!-- FLASHCARDS -->
  <div class="tab-panel" id="tab-flash">
    <div class="chip-row" id="fc-filters">
      <button class="chip active" data-f="all">All</button>
      <button class="chip" data-f="hard">🔴 Hard</button>
      <button class="chip" data-f="unseen">⬜ Unseen</button>
    </div>
    <div class="fc-controls">
      <span class="fc-info" id="fc-info">Card 1</span>
      <button class="btn" onclick="fcShuffle()">🔀</button>
    </div>
    <div class="fc-progress"><div class="fc-fill" id="fc-fill"></div></div>
    <div class="card-wrap" id="card-wrap" style="height:320px">
      <div class="card-inner" id="card-inner">
        <div class="card-face card-front" style="justify-content:center">
          <div id="fc-kanji" style="font-size:80px;color:var(--red);text-shadow:0 0 40px var(--red-glow);font-weight:900">漢</div>
          <div class="fc-hint">— tap to flip —</div>
        </div>
        <div class="card-face card-back" style="padding:20px;align-items:flex-start;justify-content:flex-start;overflow-y:auto">
          <div id="fc-reading" style="font-size:22px;color:var(--gold);width:100%;text-align:center"></div>
          <div id="fc-roma" style="font-family:var(--font-mono);font-size:12px;color:var(--muted);width:100%;text-align:center;margin:4px 0"></div>
          <div id="fc-bn" style="font-size:18px;color:var(--green);width:100%;text-align:center;margin:8px 0"></div>
          <div id="fc-eng" style="font-size:13px;color:var(--white);width:100%;text-align:center"></div>
          <div id="fc-ex" style="font-size:12px;color:var(--muted);width:100%;text-align:center;margin-top:10px;padding-top:10px;border-top:1px solid var(--border)"></div>
        </div>
      </div>
    </div>
    <div class="fc-rating" id="fc-rating">
      <button class="rate-btn again" onclick="kfcRate('again')">🔴 Again</button>
      <button class="rate-btn hard" onclick="kfcRate('hard')">🟠 Hard</button>
      <button class="rate-btn good" onclick="kfcRate('good')">🟡 Good</button>
      <button class="rate-btn easy" onclick="kfcRate('easy')">🟢 Easy</button>
    </div>
    <div class="fc-nav" style="margin-top:14px">
      <button class="btn" onclick="kfcNav(-1)">← Prev</button>
      <button class="btn btn-primary" onclick="kfcFlip()">Flip</button>
      <button class="btn" onclick="kfcNav(1)">Next →</button>
    </div>
  </div>

  <!-- QUIZ -->
  <div class="tab-panel" id="tab-quiz">
    <div id="quiz-setup">
      <div class="quiz-setup">
        <p style="color:var(--muted);font-family:var(--font-mono);font-size:11px;margin-bottom:20px">Test your kanji knowledge</p>
        <div class="quiz-opts">
          <div class="quiz-opt-group"><label>Mode</label>
            <div class="radio-row" id="qt-row">
              <span class="radio-chip sel" data-val="kanji_bn">Kanji → Bangla</span>
              <span class="radio-chip" data-val="kanji_reading">Kanji → Reading</span>
            </div>
          </div>
          <div class="quiz-opt-group"><label>Questions</label>
            <div class="radio-row" id="qc-row">
              <span class="radio-chip" data-val="10">10</span>
              <span class="radio-chip sel" data-val="20">20</span>
              <span class="radio-chip" data-val="all">All</span>
            </div>
          </div>
        </div>
        <button class="btn btn-primary" style="font-size:14px;padding:12px 36px" onclick="startKQuiz()">START QUIZ ⚔️</button>
      </div>
    </div>
    <div id="quiz-active" style="display:none"></div>
    <div id="quiz-result" style="display:none"></div>
  </div>
</div>

<!-- DETAIL PANEL -->
<div class="panel-overlay" id="panel-overlay" onclick="closePanel()"></div>
<div class="kanji-panel" id="kanji-panel">
  <button class="kp-close" onclick="closePanel()">✕</button>
  <div class="kp-char" id="kp-char">漢</div>
  <div id="kp-details" style="font-size:14px;line-height:2"></div>
</div>

<footer class="samurai-footer"></footer>
<script src="data-loader.js"></script>
<script src="app.js"></script>
<script>
(function(){
'use strict';
let KANJI=[], fc=null, quiz=null, timer=null;

window.addEventListener('samurai-data-ready', init);
loadSamuraiData(); buildNavbar('n5'); buildFooter(); initSakura(); hideLoader();

function init(){
  KANJI = window.SAMURAI_DATA.kanji || [];
  document.getElementById('kanji-sub').textContent = `${KANJI.length} kanji loaded`;
  buildKanjiList();
  initFC();
  initQuizRadio();
}

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}

/* ═══ KANJI LIST ═══ */
function buildKanjiList(){
  const el=document.getElementById('kanji-list');
  let html=`<table class="word-table"><thead><tr><th>#</th><th>Kanji</th><th>Reading</th><th>Bangla</th><th>English</th><th>🔊</th></tr></thead><tbody>`;
  KANJI.forEach((k,i)=>{
    const m=getWordMastery('kanji',null,i);
    const dot=MASTERY_ICONS[m]||'⚪';
    html+=`<tr style="animation-delay:${i*15}ms;cursor:pointer" onclick="openPanel(${i})">
      <td class="num-cell">${dot} ${i+1}</td>
      <td style="font-size:28px;color:var(--red);text-shadow:0 0 8px var(--red-glow);font-weight:900">${esc(k.kanji)}</td>
      <td style="font-family:var(--font-body);font-size:14px">${esc(k.reading)}</td>
      <td class="bn-cell">${esc(k.bn)}</td>
      <td style="color:var(--muted);font-size:12px">${esc(k.eng)}</td>
      <td><button class="speak-btn" onclick="event.stopPropagation();speak('${esc(k.reading)}',this)">🔊</button></td>
    </tr>`;
  });
  html+='</tbody></table>';
  el.innerHTML=html;
}

document.getElementById('search').addEventListener('input',function(){
  const q=this.value.toLowerCase();
  document.querySelectorAll('.word-table tbody tr').forEach(r=>{
    r.style.display=r.textContent.toLowerCase().includes(q)?'':'none';
  });
});

/* ═══ DETAIL PANEL ═══ */
window.openPanel=function(i){
  const k=KANJI[i]; if(!k) return;
  document.getElementById('kp-char').textContent=k.kanji;
  const hex=k.kanji.codePointAt(0).toString(16).padStart(5,'0');
  const svgUrl=`https://raw.githubusercontent.com/KanjiVG/kanjivg/master/kanji/${hex}.svg`;
  document.getElementById('kp-details').innerHTML=`
    <div style="margin-bottom:12px"><span style="color:var(--muted);font-family:var(--font-mono);font-size:10px">READING</span><br>
    <span style="font-size:20px;color:var(--gold)">${esc(k.reading)}</span></div>
    <div style="margin-bottom:12px"><span style="color:var(--muted);font-family:var(--font-mono);font-size:10px">ROMAJI</span><br>${esc(k.roma)}</div>
    <div style="margin-bottom:12px"><span style="color:var(--muted);font-family:var(--font-mono);font-size:10px">BANGLA</span><br><span style="color:var(--green)">${esc(k.bn)}</span></div>
    <div style="margin-bottom:12px"><span style="color:var(--muted);font-family:var(--font-mono);font-size:10px">ENGLISH</span><br>${esc(k.eng)}</div>
    <div style="margin-bottom:12px;padding-top:12px;border-top:1px solid var(--border)"><span style="color:var(--muted);font-family:var(--font-mono);font-size:10px">EXAMPLE</span><br>
    <span style="color:var(--gold)">${esc(k.exJp)}</span><br>${esc(k.exEng)}<br>${esc(k.exBn)}</div>
    <div style="text-align:center;margin-top:16px"><button class="speak-btn" onclick="speak('${esc(k.reading)}',this)" style="width:44px;height:44px;font-size:18px">🔊</button></div>
    <div style="text-align:center;margin-top:12px"><img src="${svgUrl}" alt="Stroke order" style="max-width:120px;filter:invert(1) opacity(.6)" onerror="this.style.display='none'"></div>`;
  document.getElementById('kanji-panel').classList.add('open');
  document.getElementById('panel-overlay').classList.add('open');
};
window.closePanel=function(){
  document.getElementById('kanji-panel').classList.remove('open');
  document.getElementById('panel-overlay').classList.remove('open');
};

/* ═══ FLASHCARDS ═══ */
function initFC(){
  fc=new SamuraiFlashcards(KANJI,{lessonId:null,isKanji:true});
  document.querySelectorAll('#fc-filters .chip').forEach(c=>{
    c.addEventListener('click',function(){
      document.querySelectorAll('#fc-filters .chip').forEach(x=>x.classList.remove('active'));
      this.classList.add('active');
      fc.setFilter(this.dataset.f); renderKFC();
    });
  });
  renderKFC();
}
function renderKFC(){
  if(!fc||!fc.current()) return;
  const k=fc.current();
  document.getElementById('fc-kanji').textContent=k.kanji;
  document.getElementById('fc-reading').textContent=k.reading||'';
  document.getElementById('fc-roma').textContent=k.roma||'';
  document.getElementById('fc-bn').textContent=k.bn||'';
  document.getElementById('fc-eng').textContent=k.eng||'';
  document.getElementById('fc-ex').innerHTML=k.exJp?`📝 ${esc(k.exJp)}<br>${esc(k.exEng)}`:'';
  document.getElementById('fc-info').textContent=`Card ${fc.idx+1} of ${fc.total()}`;
  document.getElementById('fc-fill').style.width=fc.progress()+'%';
  document.getElementById('card-inner').classList.remove('flipped');
  document.getElementById('fc-rating').classList.remove('visible');
  fc.flipped=false;
  speak(k.reading||k.kanji);
}
window.kfcFlip=function(){fc.flip();document.getElementById('card-inner').classList.toggle('flipped',fc.flipped);document.getElementById('fc-rating').classList.toggle('visible',fc.flipped);};
window.kfcNav=function(d){fc.nav(d);renderKFC();};
window.kfcRate=function(r){fc.rate(r);renderKFC();};
window.fcShuffle=function(){fc.shuffle();renderKFC();};
document.getElementById('card-wrap').addEventListener('click',kfcFlip);

/* ═══ TAB ═══ */
window.showTab=function(t){
  document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('tab-'+t).classList.add('active');
  event.target.classList.add('active');
  if(t==='flash') renderKFC();
};

/* ═══ QUIZ ═══ */
function initQuizRadio(){
  document.querySelectorAll('.radio-chip').forEach(c=>{
    c.addEventListener('click',function(){
      this.closest('.radio-row').querySelectorAll('.radio-chip').forEach(x=>x.classList.remove('sel'));
      this.classList.add('sel');
    });
  });
}
function getR(id){const c=document.querySelector('#'+id+' .radio-chip.sel');return c?c.dataset.val:null;}

window.startKQuiz=function(){
  const type=getR('qt-row')||'kanji_bn', count=getR('qc-row')||'20';
  if(!KANJI.length){alert('No kanji loaded');return;}
  quiz=new SamuraiQuiz(KANJI,{type,count,lessonId:null,isKanji:true});
  timer=startSessionTimer();
  document.getElementById('quiz-setup').style.display='none';
  document.getElementById('quiz-result').style.display='none';
  document.getElementById('quiz-active').style.display='block';
  renderKQ();
};

function renderKQ(){
  const q=quiz.current(),el=document.getElementById('quiz-active');
  el.innerHTML=`<div style="max-width:640px;margin:0 auto">
    <div style="display:flex;justify-content:space-between;margin-bottom:12px">
      <span style="font-family:var(--font-mono);font-size:11px;color:var(--muted)">Q${quiz.idx+1}/${quiz.total()}</span>
      <span style="font-family:var(--font-mono);font-size:11px;color:var(--green)">✓ ${quiz.score}</span>
    </div>
    <div class="qz-progress-bar"><div class="qz-prog-fill" style="width:${quiz.progress()}%"></div></div>
    <div class="qz-question">
      <div class="qz-prompt">${q.prompt}</div>
      <div class="qz-word" style="font-size:56px;color:var(--red)">${esc(q.display)}</div>
    </div>
    <div class="qz-options" id="qz-opts">
      ${q.opts.map((o,i)=>`<button class="qz-opt" onclick="kpick(this,'${esc(o)}')" style="animation-delay:${i*80}ms">${esc(o)}</button>`).join('')}
    </div>
    <div class="qz-feedback" id="qz-feedback"></div>
    <div id="qz-next" style="display:none;text-align:center;margin-top:12px">
      <button class="btn btn-primary" onclick="kNext()">Next →</button>
    </div>
  </div>`;
}

window.kpick=function(btn,chosen){
  if(quiz.answered) return;
  const ok=quiz.answer(chosen);
  document.querySelectorAll('.qz-opt').forEach(o=>{o.disabled=true;if(o.textContent===quiz.current().correct)o.classList.add('correct');});
  if(ok){btn.classList.add('correct');slashAnimation();}
  else{btn.classList.add('wrong');const fb=document.getElementById('qz-feedback');fb.textContent='Correct: '+quiz.current().correct;fb.classList.add('show');}
  document.getElementById('qz-next').style.display='block';
};

window.kNext=function(){if(quiz.next())renderKQ();else showKResult();};

function showKResult(){
  if(timer){timer.stop();timer=null;}
  const r=quiz.getResult();
  document.getElementById('quiz-active').style.display='none';
  const el=document.getElementById('quiz-result');el.style.display='block';
  el.innerHTML=`<div class="quiz-result">
    <div class="result-grade" style="color:${r.color}">${r.grade}</div>
    <div class="result-label">${r.pct}% CORRECT</div>
    <div class="result-msg">${r.msg}</div>
    <div class="result-grid">
      <div class="result-stat"><div class="result-stat-val" style="color:var(--green)">${r.score}</div><div class="result-stat-lbl">Correct</div></div>
      <div class="result-stat"><div class="result-stat-val" style="color:var(--red)">${r.total-r.score}</div><div class="result-stat-lbl">Wrong</div></div>
      <div class="result-stat"><div class="result-stat-val" style="color:var(--gold)">${r.bestStreak}</div><div class="result-stat-lbl">Streak</div></div>
    </div>
    ${r.wrongs.length?'<div class="wrong-list"><h4>Review these:</h4>'+r.wrongs.map(q=>`<div class="wrong-item"><span class="wrong-jp" style="color:var(--red);font-size:24px">${esc(q.w.kanji||q.w.jp)}</span><span class="wrong-bn">${esc(q.w.bn)}</span></div>`).join('')+'</div>':''}
    <div style="margin-top:20px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap">
      <button class="btn btn-primary" onclick="startKQuiz()">↺ Retry</button>
      <button class="btn" onclick="document.getElementById('quiz-result').style.display='none';document.getElementById('quiz-setup').style.display='block'">⚙ New</button>
    </div></div>`;
}

window.addEventListener('samurai-key',function(e){
  if(!document.getElementById('tab-flash').classList.contains('active')) return;
  const k=e.detail;
  if(k===' ')kfcFlip();else if(k==='1')kfcRate('again');else if(k==='2')kfcRate('hard');else if(k==='3')kfcRate('good');else if(k==='4')kfcRate('easy');
});
})();
</script>
</body>
</html>
