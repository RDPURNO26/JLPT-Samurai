<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>JLPT Samurai — Auth</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚔️</text></svg>">
<link rel="stylesheet" href="style.css">
<style>
body { display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; background: var(--bg); overflow: hidden; }
#sakura-canvas { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
.auth-box { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 40px; width: 100%; max-width: 400px; z-index: 10; box-shadow: 0 10px 40px rgba(0,0,0,0.5); text-align: center; position: relative; }
.auth-logo { font-family: var(--font-head); font-size: 32px; color: var(--red); letter-spacing: 4px; margin-bottom: 10px; text-shadow: 0 0 20px var(--red-glow); }
.auth-sub { font-family: var(--font-mono); font-size: 12px; color: var(--muted); margin-bottom: 30px; }
.auth-input { width: 100%; background: var(--bg); border: 1px solid var(--border); padding: 12px 16px; color: var(--white); font-family: var(--font-body); font-size: 14px; border-radius: 4px; margin-bottom: 16px; outline: none; transition: all 0.2s; }
.auth-input:focus { border-color: var(--red); box-shadow: 0 0 10px var(--red-glow); }
.auth-btn { width: 100%; background: var(--red); color: var(--white); border: none; padding: 14px; font-family: var(--font-head); font-size: 16px; font-weight: bold; letter-spacing: 2px; border-radius: 4px; cursor: pointer; transition: all 0.2s; text-transform: uppercase; margin-bottom: 16px; }
.auth-btn:hover { background: #e62e00; box-shadow: 0 0 15px var(--red-glow); transform: translateY(-2px); }
.auth-toggle { font-size: 13px; color: var(--muted); cursor: pointer; transition: color 0.2s; background: none; border: none; font-family: var(--font-body); }
.auth-toggle:hover { color: var(--gold); }
#auth-error { color: var(--red); font-size: 13px; margin-bottom: 16px; display: none; }
</style>
</head>
<body>
<canvas id="sakura-canvas"></canvas>

<div class="auth-box">
  <div class="auth-logo">JLPT SAMURAI</div>
  <div class="auth-sub" id="auth-title">Enter the Dojo</div>
  
  <div id="auth-error"></div>
  
  <form id="auth-form" onsubmit="handleAuth(event)">
    <input type="text" id="auth-user" class="auth-input" placeholder="Username or Email" required autocomplete="off">
    <input type="email" id="auth-email" class="auth-input" placeholder="Email Address" style="display:none;" autocomplete="off">
    <input type="password" id="auth-pass" class="auth-input" placeholder="Password" required>
    <div style="text-align:left; margin-bottom:16px;">
      <label style="color:var(--muted); font-size:13px; font-family:var(--font-mono); cursor:pointer;">
        <input type="checkbox" id="auth-remember" style="margin-right:8px; accent-color:var(--red);">
        Stay logged in
      </label>
    </div>
    <button type="submit" class="auth-btn" id="auth-submit">Login</button>
  </form>
  
  <button class="auth-toggle" onclick="toggleMode()">Don't have an account? <b>Sign up</b></button>
</div>

<script src="app.js"></script>
<script>
let mode = 'login';
initSakura();

function toggleMode() {
  mode = mode === 'login' ? 'signup' : 'login';
  document.getElementById('auth-title').textContent = mode === 'login' ? 'Enter the Dojo' : 'Join the Samurai';
  document.getElementById('auth-submit').textContent = mode === 'login' ? 'Login' : 'Create Account';
  document.querySelector('.auth-toggle').innerHTML = mode === 'login' 
    ? "Don't have an account? <b>Sign up</b>" 
    : "Already have an account? <b>Log in</b>";
  document.getElementById('auth-error').style.display = 'none';
  
  const userField = document.getElementById('auth-user');
  const emailField = document.getElementById('auth-email');
  if (mode === 'signup') {
    userField.placeholder = "Choose a Username";
    emailField.style.display = 'block';
    emailField.required = true;
  } else {
    userField.placeholder = "Username or Email";
    emailField.style.display = 'none';
    emailField.required = false;
  }
}

async function handleAuth(e) {
  e.preventDefault();
  const u = document.getElementById('auth-user').value.trim();
  const emailVal = document.getElementById('auth-email').value.trim();
  const p = document.getElementById('auth-pass').value;
  
  if (u.length < 3) { showError("Username must be at least 3 characters."); return; }
  if (mode === 'signup' && (emailVal.length < 5 || !emailVal.includes('@'))) { showError("Please enter a valid email address."); return; }
  if (p.length < 6) { showError("Password must be at least 6 characters."); return; }
  
  const btn = document.getElementById('auth-submit');
  btn.disabled = true;
  btn.textContent = 'Processing...';

  initFirebase(async () => {
    try {
      const remember = document.getElementById('auth-remember').checked;
      const persistence = remember ? firebase.auth.Auth.Persistence.LOCAL : firebase.auth.Auth.Persistence.SESSION;
      await firebase.auth().setPersistence(persistence);

      if (mode === 'signup') {
        // 1. Check if username exists
        const usernameDoc = await firebase.firestore().collection('samurai_usernames').doc(u.toLowerCase()).get();
        if (usernameDoc.exists) {
          throw new Error("Username is already taken.");
        }
        
        // 2. Create Auth User
        const cred = await firebase.auth().createUserWithEmailAndPassword(emailVal, p);
        
        // 3. Save username mapping and profile
        await firebase.firestore().collection('samurai_usernames').doc(u.toLowerCase()).set({ email: emailVal });
        await firebase.firestore().collection('samurai_users').doc(cred.user.uid).set({ username: u }, { merge: true });
        
        loginSuccess(cred.user.uid, emailVal, u);
      } else {
        // Login Flow
        let loginEmail = u;
        // If they didn't enter an email, look up the username
        if (!u.includes('@')) {
          const usernameDoc = await firebase.firestore().collection('samurai_usernames').doc(u.toLowerCase()).get();
          if (!usernameDoc.exists) {
            throw new Error("Username not found.");
          }
          loginEmail = usernameDoc.data().email;
        }
        
        const cred = await firebase.auth().signInWithEmailAndPassword(loginEmail, p);
        
        // Fetch their username for local storage
        let usernameToSave = u.includes('@') ? loginEmail.split('@')[0] : u;
        const userDoc = await firebase.firestore().collection('samurai_users').doc(cred.user.uid).get();
        if(userDoc.exists && userDoc.data().username) usernameToSave = userDoc.data().username;
        
        loginSuccess(cred.user.uid, loginEmail, usernameToSave);
      }
    } catch (error) {
      handleFirebaseError(error);
      btn.disabled = false;
      btn.textContent = mode === 'login' ? 'Login' : 'Create Account';
    }
  });
}

function handleFirebaseError(error) {
  let msg = error.message;
  // Make obscure Firebase errors user-friendly
  if (error.code === 'auth/invalid-login-credentials' || msg.includes('INVALID_LOGIN_CREDENTIALS') || error.code === 'auth/wrong-password' || error.code === 'auth/user-not-found') {
    msg = "Incorrect username, email, or password.";
  } else if (error.code === 'auth/email-already-in-use') {
    msg = "An account with this email already exists.";
  } else if (error.code === 'auth/weak-password') {
    msg = "Password is too weak. Please use at least 6 characters.";
  } else if (msg === "Username is already taken." || msg === "Username not found.") {
    // Keep custom errors as is
  }
  showError(msg);
}

function showError(msg) {
  const err = document.getElementById('auth-error');
  err.textContent = msg;
  err.style.display = 'block';
}

function loginSuccess(uid, email, username) {
  slashAnimation();
  localStorage.setItem('samurai_active_user', uid);
  localStorage.setItem('samurai_active_email', email);
  if(username) localStorage.setItem('samurai_username', username);
  setTimeout(() => {
    window.location.href = 'index.html';
  }, 600);
}

// Auto-login if Firebase session is still active
if (typeof initFirebase === 'function') {
  initFirebase(() => {
    firebase.auth().onAuthStateChanged(user => {
      if (user) {
        // Attempt to fetch username
        firebase.firestore().collection('samurai_users').doc(user.uid).get().then(doc => {
          const username = doc.exists && doc.data().username ? doc.data().username : user.email.split('@')[0];
          loginSuccess(user.uid, user.email, username);
        }).catch(() => {
          loginSuccess(user.uid, user.email, '');
        });
      } else {
        hideLoader();
      }
    });
  });
} else {
  hideLoader();
}
</script>
</body>
</html>
